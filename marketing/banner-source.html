<!DOCTYPE html>
<html><head><meta charset="utf8"><style>
body{margin:0;width:1280px;height:720px;background:#07070c;overflow:hidden;
  font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;color:#e8ecf4;position:relative}
body::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 18% 10%,rgba(124,58,237,.35) 0%,transparent 55%),
             radial-gradient(ellipse at 88% 95%,rgba(34,211,238,.15) 0%,transparent 50%);}
.phone{position:absolute;right:70px;top:110px;width:340px;height:500px;border-radius:36px;
  border:3px solid rgba(168,85,247,.5);background:#0a0a12;overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,.8),0 0 80px rgba(124,58,237,.25)}
.phone img{width:100%;display:block;object-fit:cover;object-position:top;height:100%}
.glow{position:absolute;left:70px;top:150px;max-width:640px}
h1{font-size:58px;font-weight:800;line-height:1.1;margin:0;letter-spacing:-1px}
.grad{background:linear-gradient(180deg,#fff,#a78bfa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tag{font-size:21px;color:#94a3b8;margin-top:22px}
.badges{margin-top:30px;display:flex;gap:10px}
.badge{font-size:13px;padding:7px 16px;border-radius:20px;background:rgba(30,30,46,.8);
  border:1px solid rgba(255,255,255,.1)}
.badge b{color:#22c55e}
.url{position:absolute;left:70px;bottom:56px;font-size:19px;color:#a78bfa;font-weight:700;letter-spacing:1px}
.oss{position:absolute;right:70px;bottom:56px;font-size:14px;color:#64748b}
</style></head><body>
<div class="glow">
  <h1>The home screen is<br><span class="grad">an agent.</span><br>
  The phone is<br><span class="grad">a server.</span></h1>
  <div class="tag">Agentic OS — open-source, AI-first. No cloud. No systemd.</div>
  <div class="badges">
    <span class="badge"><b>●</b> AGPL-3.0</span>
    <span class="badge">On-device LLM</span>
    <span class="badge">E2E sharing</span>
    <span class="badge">v0.3.0-beta</span>
  </div>
</div>
<div class="phone"><img src="shot-home.png"></div>
<div class="url">dynalora.com</div>
<div class="oss">github.com/iguha0/agentic-os</div>
</body></html>
